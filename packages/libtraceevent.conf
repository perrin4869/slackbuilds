CATEGORY=libraries
PRGNAM=libtraceevent
SOURCE=nvchecker
# git.kernel.org is cgit - no API, nvchecker's regex source scrapes the
# /refs/ page's tag links directly.
NVCHECKER_URL="https://git.kernel.org/pub/scm/libs/libtrace/libtraceevent.git/refs/"
NVCHECKER_REGEX='tag/\?h=libtraceevent-([0-9][0-9.]*)'
SRC_URL="https://git.kernel.org/pub/scm/libs/libtrace/libtraceevent.git/snapshot/libtraceevent-%VERSION%.tar.gz"
ARCHIVE="libtraceevent-%VERSION%.tar.gz"
PRGDIR="libtraceevent-%VERSION%"

# Last version this repo opened an update PR for. Dedupe only - see
# tree-sitter.conf for why this is not the source of truth for "current".
VERSION=1.7.2
