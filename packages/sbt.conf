CATEGORY=development
PRGNAM=sbt
SOURCE=github
GITHUB_REPO=sbt/sbt
TAG_REGEX='^v([0-9]+\.[0-9]+\.[0-9]+)$'
# sbt.info ships DOWNLOAD_x86_64/MD5SUM_x86_64 only (DOWNLOAD="UNSUPPORTED");
# not exercised while FROZEN, but noted here for whenever this thaws.
GENERATOR=simple
SRC_URL="https://github.com/sbt/sbt/releases/download/v%VERSION%/sbt-%VERSION%.tgz"
ARCHIVE="sbt-%VERSION%.tgz"
PRGDIR="sbt"

# Last version this repo opened an update PR for. Dedupe only - see
# tree-sitter.conf for why this is not the source of truth for "current".
VERSION=2.0.8

# sbt 2.x needs a glibc newer than Slackware 15.0 ships. Detection still
# resolves and reports the latest upstream version (see run summary) but
# never opens a PR while this is set.
FROZEN=1
FROZEN_REASON="needs glibc newer than 15.0; blocked until the next Slackware release"
