CATEGORY=desktop
PRGNAM=wofi
SOURCE="https://hg.sr.ht/~scoopta/wofi"
# hg.sr.ht has no API for newreleases.io (or anything else) to watch -
# nvchecker's regex source scrapes the /tags page instead. Matches version
# characters directly (not "everything until a quote"), so no TOML/shell
# quoting concerns from the regex itself.
POLL=1
NVCHECKER_URL="https://hg.sr.ht/~scoopta/wofi/tags"
NVCHECKER_REGEX='archive/v([0-9][0-9.]*)\.tar\.gz'
SRC_URL="https://hg.sr.ht/~scoopta/wofi/archive/v%VERSION%.tar.gz"
ARCHIVE="wofi-%VERSION%.tar.gz"
PRGDIR="wofi-%VERSION%"

# Last version this repo opened an update PR for. Dedupe only - see
# tree-sitter.conf for why this is not the source of truth for "current".
VERSION=1.4.1
