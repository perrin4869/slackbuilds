name: Detect
description: >-
  Resolve the latest valid upstream version for one, several, or all tracked
  packages, and decide which ones need an update PR opened.
inputs:
  packages:
    description: >-
      Space-separated PRGNAMs to check. Empty (the default) checks every
      packages/*.conf.
    required: false
    default: ''
outputs:
  result:
    description: >-
      One line per package checked: "NEEDS_UPDATE <prgnam> <category>
      <version>", "FROZEN <prgnam> <reason>", "UP_TO_DATE <prgnam>
      <version>", or "UNRESOLVED <prgnam>".
    value: ${{ steps.detect.outputs.result }}
runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        source scripts/lib.sh

        # check_one is guarded with `||` per-package: it can die() (a
        # malformed .conf, a missing required field), and since that runs
        # via command substitution in a plain assignment, an unguarded
        # failure would abort this whole loop under set -e - one bad
        # package would silently take every other package's result with
        # it. Caught here instead, reported as its own line.
        result=""
        if [ -n "$PACKAGES" ]; then
          for prgnam in $PACKAGES; do
            conf="packages/$prgnam.conf"
            if [ ! -f "$conf" ]; then
              result+="UNRESOLVED $prgnam (no such package config: $conf)"$'\n'
              continue
            fi
            line="$(check_one "$conf")" || line="UNRESOLVED $prgnam (check failed - see log)"
            result+="$line"$'\n'
          done
        else
          for conf in packages/*.conf; do
            [ -e "$conf" ] || continue
            prgnam="$(basename "$conf" .conf)"
            line="$(check_one "$conf")" || line="UNRESOLVED $prgnam (check failed - see log)"
            result+="$line"$'\n'
          done
        fi

        {
          echo "result<<GHADETECTEOF"
          printf '%s' "$result"
          echo "GHADETECTEOF"
        } >> "$GITHUB_OUTPUT"
