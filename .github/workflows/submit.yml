---
name: Submit upstream

on:
  push:
    branches: [master]
    paths:
      - 'staging/**'

concurrency:
  group: submit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover:
    name: Discover merged packages
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: list
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD~1 HEAD -- 'staging/*/*/UPDATE.json' \
            | xargs -r -n1 dirname | sort -u)"
          json="$(printf '%s\n' "$changed" | jq -R -s -c '[splits("\n") | select(length > 0)]')"
          echo "packages=$json" >> "$GITHUB_OUTPUT"

  submit:
    name: ${{ matrix.package }}
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v5

      - name: Submit to SlackBuildsOrg/slackbuilds
        id: submit
        env:
          SBO_SUBMIT_TOKEN: ${{ secrets.SBO_SUBMIT_TOKEN }}
        run: |
          set -euo pipefail
          prgnam="$(basename "${{ matrix.package }}")"
          version="$(jq -r .version "${{ matrix.package }}/UPDATE.json")"
          bash scripts/submit.sh "$prgnam" "$version" "${{ matrix.package }}" | tee submit-output.txt
          echo "result=$(cat submit-output.txt)" >> "$GITHUB_OUTPUT"

      - name: Commit drift correction, if any
        # scripts/submit.sh syncs staging/<pkg>/ to the fresh copy it
        # actually submitted (not the possibly-stale reviewed copy) and
        # leaves it in place - it's the diff baseline for this package's
        # *next* update PR, not a one-off review artifact. Usually nothing
        # changed (no drift), so there's nothing to commit.
        run: |
          set -euo pipefail
          if git diff --quiet -- "${{ matrix.package }}"; then
            echo "no drift - staging/ already matched what was submitted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ matrix.package }}"
          printf 'chore: sync staged %s to what was actually submitted\n\n%s\n' \
            "$(basename "${{ matrix.package }}")" "${{ steps.submit.outputs.result }}" > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt
          # Master may have moved (another matrix job's commit) - rebase
          # this one onto it rather than clobbering.
          for i in 1 2 3 4 5; do
            git fetch origin master
            git rebase origin/master && break
            sleep $((i * 5))
          done
          git push origin HEAD:master
