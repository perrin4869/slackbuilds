---
name: Detect updates

on:
  repository_dispatch:
    types: [upstream-release]
  # No cron: this workflow only ever checks webhook-able (github/codeberg)
  # packages - see "Determine target package" below. Packages with no
  # webhook option at all (SOURCE=nvchecker) are detect-pull.yml's job.
  workflow_dispatch:
    inputs:
      package:
        description: 'Single package to check (PRGNAM); all packages if empty'
        required: false

concurrency:
  group: detect
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  detect:
    name: Detect + open update PRs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Determine target package
        id: target
        env:
          # Only set for repository_dispatch, and only if the webhook was
          # configured with the client_payload template - see README.
          PROJECT: ${{ github.event.client_payload.project }}
        run: |
          set -euo pipefail
          # Every packages/*.conf except SOURCE=nvchecker ones - those have
          # no webhook option and are detect-pull.yml's job (it doesn't
          # install nvchecker here, and doesn't need to).
          all_pushable="$(grep -L '^SOURCE=nvchecker$' packages/*.conf \
            | xargs -n1 basename | sed 's/\.conf$//' | tr '\n' ' ')"

          if [ -n "${{ github.event.inputs.package }}" ]; then
            package="${{ github.event.inputs.package }}"
          elif [ -n "$PROJECT" ]; then
            source scripts/lib.sh
            package="$(find_package_by_repo "$PROJECT")"
            if [ -n "$package" ]; then
              echo "webhook names $PROJECT -> scoping to $package"
            else
              echo "webhook names $PROJECT, no packages/*.conf matches it - checking everything pushable"
              package="$all_pushable"
            fi
          else
            package="$all_pushable"
          fi
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Run detect.sh
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          bash scripts/detect.sh ${{ steps.target.outputs.package }} | tee detect-output.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Update detection'
            echo
            echo '| status | package | detail |'
            echo '|---|---|---|'
            while IFS=' ' read -r status prgnam rest; do
              [ -n "$status" ] || continue
              printf '| %s | %s | %s |\n' "$status" "$prgnam" "$rest"
            done < detect-output.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open update PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/open-update-prs.sh detect-output.txt
