---
name: Detect updates

on:
  repository_dispatch:
    types: [upstream-release]
  # No cron backstop: every packages/*.conf right now is SOURCE=github,
  # which newreleases.io's webhook fully covers. If a non-GitHub source
  # (wofi/sr.ht, libtraceevent/kernel.org) gets tracked, that's the point
  # to add one back - newreleases.io doesn't watch those at all.
  workflow_dispatch:
    inputs:
      package:
        description: 'Single package to check (PRGNAM); all packages if empty'
        required: false

concurrency:
  group: detect
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  detect:
    name: Detect + open update PRs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Determine target package
        id: target
        env:
          # Only set for repository_dispatch, and only if the webhook was
          # configured with the client_payload template - see README.
          PROJECT: ${{ github.event.client_payload.project }}
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.package }}" ]; then
            package="${{ github.event.inputs.package }}"
          elif [ -n "$PROJECT" ]; then
            source scripts/lib.sh
            package="$(find_package_by_repo "$PROJECT")"
            if [ -n "$package" ]; then
              echo "webhook names $PROJECT -> scoping to $package"
            else
              echo "webhook names $PROJECT, no packages/*.conf matches it - checking everything"
            fi
          else
            package=""
          fi
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Run detect.sh
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          bash scripts/detect.sh ${{ steps.target.outputs.package }} | tee detect-output.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Update detection'
            echo
            echo '| status | package | detail |'
            echo '|---|---|---|'
            while IFS=' ' read -r status prgnam rest; do
              [ -n "$status" ] || continue
              printf '| %s | %s | %s |\n' "$status" "$prgnam" "$rest"
            done < detect-output.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open update PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          while read -r status prgnam category version; do
            [ "$status" = NEEDS_UPDATE ] || continue

            branch="update/${prgnam}-${version}"
            echo "::group::${prgnam} -> ${version}"

            git fetch origin "$branch" 2>/dev/null && {
              echo "branch $branch already exists, skipping"
              echo "::endgroup::"
              continue
            }

            upstream_dir="$(mktemp -d)"
            git clone --quiet --depth 1 --branch master \
              https://github.com/SlackBuildsOrg/slackbuilds.git "$upstream_dir"
            upstream_sha="$(git -C "$upstream_dir" rev-parse HEAD)"

            rm -rf "${category}/${prgnam}"
            mkdir -p "${category}/${prgnam}"
            bash scripts/generate.sh "$prgnam" "$version" "$upstream_dir" "${category}/${prgnam}"

            bash scripts/preview.sh "$prgnam" "$version" > /tmp/pr-body.md

            cat > "${category}/${prgnam}/UPDATE.json" <<EOF
          {
            "prgnam": "$prgnam",
            "category": "$category",
            "version": "$version",
            "upstream_sha": "$upstream_sha"
          }
          EOF

            sed -i "s/^VERSION=.*/VERSION=$version/" "packages/${prgnam}.conf"

            git checkout -b "$branch"
            git add "${category}/${prgnam}" "packages/${prgnam}.conf"
            git commit -m "${category}/${prgnam}: Updated for version ${version}"
            git push origin "$branch"

            gh pr create \
              --title "${category}/${prgnam}: Updated for version ${version}" \
              --body-file /tmp/pr-body.md \
              --head "$branch" --base master

            git checkout -
            rm -rf "$upstream_dir"
            echo "::endgroup::"
          done < detect-output.txt
