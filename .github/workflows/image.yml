---
name: Build image

on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.*'
  schedule:
    # Picks up Slackware package/security updates even when the Dockerfile
    # itself hasn't changed.
    - cron: '5 5 1 * *'
  workflow_dispatch: {}

concurrency:
  group: image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build + push slackbuilds:15.0 and its two toolchain variants
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/docker-storage-setup

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Date tag
        id: date
        run: echo "tag=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build + push slackbuilds:15.0
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/perrin4869/slackbuilds:15.0
            ghcr.io/perrin4869/slackbuilds:15.0-${{ steps.date.outputs.tag }}

      # Each FROMs ghcr.io/perrin4869/slackbuilds:15.0 directly (see
      # Dockerfile.*) - built after the base is pushed above, so that tag
      # already exists to pull from.
      - name: Build + push slackbuilds-google-go-lang:15.0
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.google-go-lang
          push: true
          tags: |
            ghcr.io/perrin4869/slackbuilds-google-go-lang:15.0
            ghcr.io/perrin4869/slackbuilds-google-go-lang:15.0-${{ steps.date.outputs.tag }}

      - name: Build + push slackbuilds-rust-opt:15.0
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.rust-opt
          push: true
          tags: |
            ghcr.io/perrin4869/slackbuilds-rust-opt:15.0
            ghcr.io/perrin4869/slackbuilds-rust-opt:15.0-${{ steps.date.outputs.tag }}
