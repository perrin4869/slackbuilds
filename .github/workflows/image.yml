---
name: Build image

on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
  schedule:
    # Picks up Slackware package/security updates even when the Dockerfile
    # itself hasn't changed.
    - cron: '5 5 1 * *'
  workflow_dispatch: {}

concurrency:
  group: image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build + push ghcr.io/perrin4869/slackbuilds:15.0
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space / point Docker at /mnt
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Date tag
        id: date
        run: echo "tag=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build + push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/perrin4869/slackbuilds:15.0
            ghcr.io/perrin4869/slackbuilds:15.0-${{ steps.date.outputs.tag }}
