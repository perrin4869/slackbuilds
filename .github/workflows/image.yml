---
name: Build image

on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.*'
  schedule:
    # Picks up Slackware package/security updates even when the Dockerfile
    # itself hasn't changed.
    - cron: '5 5 1 * *'
  workflow_dispatch: {}

concurrency:
  group: image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build + push slackbuilds:15.0 and its two toolchain variants
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/docker-storage-setup

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Date tag
        id: date
        run: echo "tag=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # driver: docker (the daemon's built-in builder, not a separate
      # docker-container builder) shares this runner's local image store,
      # so the two derived builds below can FROM the base build's tag
      # directly - no push-to-GHCR-then-pull-back round trip for a 14.6GB
      # image. We don't need docker-container's other features here
      # (multi-platform, GHA cache export).
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Build slackbuilds:15.0
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: true
          tags: |
            ghcr.io/perrin4869/slackbuilds:15.0
            ghcr.io/perrin4869/slackbuilds:15.0-${{ steps.date.outputs.tag }}

      # A bare tag (no registry/namespace) would otherwise get pushed as
      # docker.io/library/slackbuilds:15.0 by the step above - Docker's
      # default normalization for an unqualified name - which fails
      # (unauthorized, no Docker Hub login here). Tag it locally instead,
      # after the real push, purely so Dockerfile.* below can FROM it
      # without a registry pull.
      - name: Tag slackbuilds:15.0 locally
        run: docker tag ghcr.io/perrin4869/slackbuilds:15.0 slackbuilds:15.0

      # FROMs the bare local tag slackbuilds:15.0 (see Dockerfile.*),
      # resolved straight out of this runner's image store thanks to
      # driver: docker above - not the ghcr.io tag pushed by the step
      # before this one.
      - name: Build + push slackbuilds-google-go-lang:15.0
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.google-go-lang
          push: true
          tags: |
            ghcr.io/perrin4869/slackbuilds-google-go-lang:15.0
            ghcr.io/perrin4869/slackbuilds-google-go-lang:15.0-${{ steps.date.outputs.tag }}

      - name: Build + push slackbuilds-rust-opt:15.0
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.rust-opt
          push: true
          tags: |
            ghcr.io/perrin4869/slackbuilds-rust-opt:15.0
            ghcr.io/perrin4869/slackbuilds-rust-opt:15.0-${{ steps.date.outputs.tag }}
