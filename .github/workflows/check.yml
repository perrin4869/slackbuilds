---
name: Build check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.info'

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    name: Discover changed packages
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: list
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only \
              "origin/$BASE_REF" HEAD \
              -- '*/*/*.info' \
            | xargs -r -n1 dirname | sort -u)"

          json="$(printf '%s\n' "$changed" | jq -R -s -c '[splits("\n") | select(length > 0)]')"
          echo "packages=$json" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.package }}
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7

      # Unlike image.yml (which builds new 14GB+ layers and genuinely
      # needs /mnt's headroom), this job only pulls one already-built
      # image and runs one package's build inside it - testing whether
      # the default runner's free space is enough without the extra
      # ~3min docker-storage-setup costs on every matrix job.
      - name: Derive category/prgnam from path
        id: meta
        env:
          # Passed via env, not interpolated into the script body - this
          # is a directory name out of a PR diff, not something to trust
          # as inert text. See the security note in the repo README.
          MATRIX_PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          source scripts/lib.sh
          category="$(dirname "$MATRIX_PACKAGE" | xargs basename)"
          prgnam="$(basename "$MATRIX_PACKAGE")"
          echo "category=$category" >> "$GITHUB_OUTPUT"
          echo "prgnam=$prgnam" >> "$GITHUB_OUTPUT"

          # IMAGE_VARIANT names a derived image with an expensive toolchain
          # dependency (rust-opt, google-go-lang) pre-baked in - see
          # image.yml and the field's own comment in lib.sh. Empty means
          # the base image already has everything this package needs.
          load_package_conf "packages/${prgnam}.conf"
          if [ -n "${IMAGE_VARIANT:-}" ]; then
            image="ghcr.io/perrin4869/slackbuilds-${IMAGE_VARIANT}:15.0"
          else
            image="ghcr.io/perrin4869/slackbuilds:15.0"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # Fresh current master, not a pinned historical SHA - submit.yml
      # re-derives against fresh upstream at merge time regardless (upstream
      # is always the source of truth, see its own comment), so pinning
      # here wouldn't guarantee the build check matches what's actually
      # submitted anyway. Simpler to just check against current master both
      # times.
      - name: Clone upstream and overlay staged files
        env:
          MATRIX_PACKAGE: ${{ matrix.package }}
          CATEGORY: ${{ steps.meta.outputs.category }}
          PRGNAM: ${{ steps.meta.outputs.prgnam }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch master \
            https://github.com/SlackBuildsOrg/slackbuilds.git upstream-tree

          pkg_dir="upstream-tree/${CATEGORY}/${PRGNAM}"
          cp "${MATRIX_PACKAGE}/${PRGNAM}.info" "$pkg_dir/"
          cp "${MATRIX_PACKAGE}/${PRGNAM}.SlackBuild" "$pkg_dir/"

      - name: Pull build image
        run: docker pull "${{ steps.meta.outputs.image }}"

      - name: sbolint + build + sbopkglint
        env:
          CATEGORY: ${{ steps.meta.outputs.category }}
          PRGNAM: ${{ steps.meta.outputs.prgnam }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          mkdir -p out
          # Mounted under the "local" repo slot (/etc/sbopkg/repos.d/50-local.repo),
          # not "SBo/15.0" - that slot's CheckGPG=GPG verifies the downloaded
          # source tarball against SBo's separate signed source-archive mirror,
          # which a plain upstream git clone has no matching signature for.
          # Under -e stop that "failure" is treated as a real build error and
          # sbopkg deletes the source directory and stops - so every single
          # build would fail. The "local" slot has no GPG checking at all.
          docker run --rm \
            -v "$PWD/upstream-tree:/var/lib/sbopkg/local/local" \
            -v sbo-cache:/var/cache/sbopkg \
            -v "$PWD/out:/output" \
            -e CATEGORY -e PRGNAM \
            "$IMAGE" \
            bash -lc '
              set -euo pipefail
              sed -i "s/^REPO_BRANCH=.*/REPO_BRANCH=local/;s/^REPO_NAME=.*/REPO_NAME=local/" /etc/sbopkg/sbopkg.conf
              cd /var/lib/sbopkg/local/local
              sbolint "${CATEGORY}/${PRGNAM}"
              sqg -p "${PRGNAM}"
              # sqg only writes a queue file when REQUIRES is non-empty (a
              # package with no dependencies has nothing to queue). When it
              # DOES write one, sbopkg -i <name> finds both a queuefile and
              # a package of that name and asks (interactively) which one
              # is meant - which hangs forever here (no tty attached).
              # Referencing the queuefile by its .sqf extension, per
              # the sbopkg man page, is the documented disambiguation.
              if [ -f "/var/lib/sbopkg/queues/${PRGNAM}.sqf" ]; then
                BUILD_TARGET="${PRGNAM}.sqf"
              else
                BUILD_TARGET="${PRGNAM}"
              fi
              # -k: skip anything already installed - matters for the
              # IMAGE_VARIANT images, where the expensive dependency
              # (rust-opt, google-go-lang) is already there and does not
              # need rebuilding.
              sbopkg -B -e stop -k -i "$BUILD_TARGET"
              pkg="$(ls "/tmp/${PRGNAM}"-*.tgz | head -1)"
              sbopkglint "$pkg"
              cp "$pkg" /output/
            ' 2>&1 | tee build-log.txt

      - name: Upload build log + package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ steps.meta.outputs.prgnam }}
          path: |
            build-log.txt
            out/*.tgz
          retention-days: 7
          if-no-files-found: ignore
