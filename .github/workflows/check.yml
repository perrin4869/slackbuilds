---
name: Build check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'sbo/**'

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    name: Discover changed packages
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: list
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only --diff-filter=d "origin/$BASE_REF" HEAD -- 'sbo/*/*/*' \
            | cut -d/ -f1-3 | sort -u)"
          echo "packages=$(printf '%s\n' "$changed" | jq -R -s -c '[splits("\n") | select(length > 0)]')" \
            >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.package }}
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7

      - name: Derive category/prgnam from path
        id: meta
        env:
          # Untrusted input: keep in env, see the Security section in README.
          MATRIX_PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          source scripts/lib.sh
          category="$(basename "$(dirname "$MATRIX_PACKAGE")")"
          prgnam="$(basename "$MATRIX_PACKAGE")"
          echo "category=$category" >> "$GITHUB_OUTPUT"
          echo "prgnam=$prgnam" >> "$GITHUB_OUTPUT"

          load_package_conf "packages/${prgnam}.conf"
          echo "image=ghcr.io/perrin4869/slackbuilds${CHECK_IMAGE:+-$CHECK_IMAGE}:15.0" >> "$GITHUB_OUTPUT"

      - name: Clone upstream and overlay changed files
        env:
          MATRIX_PACKAGE: ${{ matrix.package }}
          CATEGORY: ${{ steps.meta.outputs.category }}
          PRGNAM: ${{ steps.meta.outputs.prgnam }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch master \
            https://github.com/SlackBuildsOrg/slackbuilds.git upstream-tree
          cp "${MATRIX_PACKAGE}/${PRGNAM}.info" "${MATRIX_PACKAGE}/${PRGNAM}.SlackBuild" \
            "upstream-tree/${CATEGORY}/${PRGNAM}/"

      - name: Pull build image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: docker pull "$IMAGE"

      - name: sbolint + build + sbopkglint
        env:
          CATEGORY: ${{ steps.meta.outputs.category }}
          PRGNAM: ${{ steps.meta.outputs.prgnam }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          mkdir -p out
          # The "local" repo slot, not SBo/15.0: that one has CheckGPG=GPG,
          # which fails for sources not on SBo's signed mirror.
          docker run --rm \
            -v "$PWD/upstream-tree:/var/lib/sbopkg/local/local" \
            -v sbo-cache:/var/cache/sbopkg \
            -v "$PWD/out:/output" \
            -e CATEGORY -e PRGNAM \
            "$IMAGE" \
            bash -lc '
              set -euo pipefail
              sed -i "s/^REPO_BRANCH=.*/REPO_BRANCH=local/;s/^REPO_NAME=.*/REPO_NAME=local/" /etc/sbopkg/sbopkg.conf
              cd /var/lib/sbopkg/local/local
              sbolint "${CATEGORY}/${PRGNAM}"
              sqg -p "${PRGNAM}"
              # With both a queue and a package named PRGNAM, sbopkg asks
              # which one is meant and hangs without a tty; .sqf disambiguates.
              # sqg only writes a queue when REQUIRES is non-empty.
              if [ -f "/var/lib/sbopkg/queues/${PRGNAM}.sqf" ]; then
                BUILD_TARGET="${PRGNAM}.sqf"
              else
                BUILD_TARGET="${PRGNAM}"
              fi
              # -k skips the toolchain preinstalled in CHECK_IMAGE variants.
              sbopkg -B -e stop -k -i "$BUILD_TARGET"
              pkg="$(ls "/tmp/${PRGNAM}"-*.tgz | head -1)"
              sbopkglint "$pkg"
              cp "$pkg" /output/
            ' 2>&1 | tee build-log.txt

      - name: Upload build log + package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ steps.meta.outputs.prgnam }}
          path: |
            build-log.txt
            out/*.tgz
          retention-days: 7
          if-no-files-found: ignore
