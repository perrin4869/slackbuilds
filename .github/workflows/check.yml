---
name: Build check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.info'

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    name: Discover changed packages
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: list
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only \
              "origin/$BASE_REF" HEAD \
              -- '*/*/*.info' \
            | xargs -r -n1 dirname | sort -u)"

          json="$(printf '%s\n' "$changed" | jq -R -s -c '[splits("\n") | select(length > 0)]')"
          echo "packages=$json" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.package }}
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/docker-storage-setup

      - name: Derive category/prgnam from path
        id: meta
        env:
          # Passed via env, not interpolated into the script body - this
          # is a directory name out of a PR diff, not something to trust
          # as inert text. See the security note in the repo README.
          MATRIX_PACKAGE: ${{ matrix.package }}
        run: |
          category="$(dirname "$MATRIX_PACKAGE" | xargs basename)"
          prgnam="$(basename "$MATRIX_PACKAGE")"
          echo "category=$category" >> "$GITHUB_OUTPUT"
          echo "prgnam=$prgnam" >> "$GITHUB_OUTPUT"

      # Fresh current master, not a pinned historical SHA - submit.yml
      # re-derives against fresh upstream at merge time regardless (upstream
      # is always the source of truth, see its own comment), so pinning
      # here wouldn't guarantee the build check matches what's actually
      # submitted anyway. Simpler to just check against current master both
      # times.
      - name: Clone upstream and overlay staged files
        env:
          MATRIX_PACKAGE: ${{ matrix.package }}
          CATEGORY: ${{ steps.meta.outputs.category }}
          PRGNAM: ${{ steps.meta.outputs.prgnam }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch master \
            https://github.com/SlackBuildsOrg/slackbuilds.git upstream-tree

          pkg_dir="upstream-tree/${CATEGORY}/${PRGNAM}"
          cp "${MATRIX_PACKAGE}/${PRGNAM}.info" "$pkg_dir/"
          cp "${MATRIX_PACKAGE}/${PRGNAM}.SlackBuild" "$pkg_dir/"

      - name: Pull build image
        run: docker pull ghcr.io/perrin4869/slackbuilds:15.0

      - name: sbolint + build + sbopkglint
        env:
          CATEGORY: ${{ steps.meta.outputs.category }}
          PRGNAM: ${{ steps.meta.outputs.prgnam }}
        run: |
          set -euo pipefail
          mkdir -p out
          # Mounted under the "local" repo slot (/etc/sbopkg/repos.d/50-local.repo),
          # not "SBo/15.0" - that slot's CheckGPG=GPG verifies the downloaded
          # source tarball against SBo's separate signed source-archive mirror,
          # which a plain upstream git clone has no matching signature for.
          # Under -e stop that "failure" is treated as a real build error and
          # sbopkg deletes the source directory and stops - so every single
          # build would fail. The "local" slot has no GPG checking at all.
          docker run --rm \
            -v "$PWD/upstream-tree:/var/lib/sbopkg/local/local" \
            -v sbo-cache:/var/cache/sbopkg \
            -v "$PWD/out:/output" \
            -e REPO_NAME=local -e REPO_BRANCH=local \
            -e CATEGORY -e PRGNAM \
            ghcr.io/perrin4869/slackbuilds:15.0 \
            bash -lc '
              set -euo pipefail
              cd /var/lib/sbopkg/local/local
              sbolint "${CATEGORY}/${PRGNAM}"
              sqg -p "${PRGNAM}"
              sbopkg -B -e stop -i "${PRGNAM}"
              pkg="$(ls "/tmp/${PRGNAM}"-*.tgz | head -1)"
              sbopkglint "$pkg"
              cp "$pkg" /output/
            ' 2>&1 | tee build-log.txt

      - name: Upload build log + package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ steps.meta.outputs.prgnam }}
          path: |
            build-log.txt
            out/*.tgz
          retention-days: 7
          if-no-files-found: ignore
