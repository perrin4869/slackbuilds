---
name: Detect image dependency updates

on:
  schedule:
    - cron: '5 7 * * 1'
  workflow_dispatch: {}

concurrency:
  group: image-deps
  cancel-in-progress: false

jobs:
  sbopkg:
    name: sbopkg
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install nvchecker
        run: python -m pip install nvchecker

      - name: Bump SBOPKG_VERSION in Dockerfile
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source scripts/lib.sh

          current="$(sed -n 's/^ARG SBOPKG_VERSION="\(.*\)"$/\1/p' Dockerfile)"
          [ -n "$current" ] || die "couldn't find ARG SBOPKG_VERSION=\"...\" in Dockerfile"

          latest="$(resolve_scm_version github sbopkg/sbopkg '^([0-9]+\.[0-9]+\.[0-9]+)$')"
          if [ -z "$latest" ] || ! version_gt "$latest" "$current"; then
            echo "up to date: $current"
            exit 0
          fi

          sed -i "s/^ARG SBOPKG_VERSION=\".*\"$/ARG SBOPKG_VERSION=\"${latest}\"/" Dockerfile
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Open PR
        if: steps.bump.outputs.latest != ''
        id: pr
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          # PAT so the PR isn't opened by github-actions[bot] (needs manual
          # workflow approval) and so the Notify step can actually reach you.
          token: ${{ secrets.SBO_UPDATE_PR_TOKEN }}
          title: "Dockerfile: bump sbopkg to ${{ steps.bump.outputs.latest }}"
          commit-message: "Dockerfile: bump sbopkg to ${{ steps.bump.outputs.latest }}"
          body: "sbopkg ${{ steps.bump.outputs.latest }} released (was ${{ steps.bump.outputs.current }}). Merging rebuilds the images."
          branch: image/sbopkg
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          add-paths: Dockerfile

      - name: Notify
        if: contains(fromJSON('["created", "updated"]'), steps.pr.outputs.pull-request-operation)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          PR_OPERATION: ${{ steps.pr.outputs.pull-request-operation }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "@perrin4869 sbopkg update PR ${PR_OPERATION}."

  # Not pinned: the image installs whatever SBo has published (the 15.0
  # branch), so compare against that rather than the project's releases.
  sbo-maintainer-tools:
    name: sbo-maintainer-tools
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write # to dispatch image.yml
    steps:
      - uses: actions/checkout@v7

      - name: Rebuild image if SBo has a newer sbo-maintainer-tools
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source scripts/lib.sh

          latest="$(upstream_version system sbo-maintainer-tools 15.0)"
          [ -n "$latest" ] || die "couldn't read system/sbo-maintainer-tools VERSION from SBo"

          docker pull --quiet ghcr.io/perrin4869/slackbuilds:15.0
          current="$(docker run --rm ghcr.io/perrin4869/slackbuilds:15.0 sbolint --version)"

          if ! version_gt "$latest" "$current"; then
            echo "up to date: $current"
            exit 0
          fi

          echo "SBo has sbo-maintainer-tools $latest (image has $current), dispatching rebuild"
          gh workflow run image.yml --ref "$GITHUB_REF_NAME"
