---
name: Release webhook

on:
  # We don't detect anything here - newreleases.io already did that and
  # is telling us via webhook. See "Determine target package" below for
  # what we still have to verify ourselves even so.
  repository_dispatch:
    types: [upstream-release]
  # No cron: this workflow only ever checks webhook-able (github/codeberg)
  # packages - see "Determine target package" below. Packages with no
  # webhook option at all (POLL=1) are poll.yml's job.
  workflow_dispatch:
    inputs:
      package:
        description: 'Single package to check (PRGNAM); all packages if empty'
        required: false

concurrency:
  group: webhook
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  webhook:
    name: React to release webhook + open update PRs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Determine target package
        id: target
        env:
          # Only set for repository_dispatch, and only if the webhook was
          # configured with the client_payload template - see README.
          PROJECT: ${{ github.event.client_payload.project }}
        run: |
          set -euo pipefail
          # Every packages/*.conf except POLL=1 ones - those have
          # no webhook option and are poll.yml's job (it doesn't install
          # nvchecker here, and doesn't need to).
          all_webhookable="$(grep -L '^POLL=1$' packages/*.conf \
            | xargs -n1 basename | sed 's/\.conf$//' | tr '\n' ' ')"

          if [ -n "${{ github.event.inputs.package }}" ]; then
            package="${{ github.event.inputs.package }}"
          elif [ -n "$PROJECT" ]; then
            source scripts/lib.sh
            package="$(find_package_by_repo "$PROJECT")"
            if [ -n "$package" ]; then
              echo "webhook names $PROJECT -> scoping to $package"
            else
              echo "webhook names $PROJECT, no packages/*.conf matches it - checking everything webhook-able"
              package="$all_webhookable"
            fi
          else
            package="$all_webhookable"
          fi
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Detect
        id: detect
        uses: ./.github/actions/detect
        with:
          packages: ${{ steps.target.outputs.package }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Job summary
        if: always()
        env:
          DETECT_OUTPUT: ${{ steps.detect.outputs.result }}
        run: |
          {
            echo '## Release webhook'
            echo
            echo '| status | package | detail |'
            echo '|---|---|---|'
            while IFS=' ' read -r status prgnam rest; do
              [ -n "$status" ] || continue
              printf '| %s | %s | %s |\n' "$status" "$prgnam" "$rest"
            done <<< "$DETECT_OUTPUT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open update PRs
        uses: ./.github/actions/open-update-prs
        with:
          detect-output: ${{ steps.detect.outputs.result }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
