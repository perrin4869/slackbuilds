---
name: Open update PR

# Reusable workflow so each package runs as its own matrix job.

on:
  workflow_call:
    inputs:
      prgnam:
        required: true
        type: string
      category:
        required: true
        type: string
      version:
        required: true
        type: string
    secrets:
      SBO_UPDATE_PR_TOKEN:
        required: true

# pull-requests: write is for the Notify comment, posted with the default token.
permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    name: ${{ inputs.prgnam }} -> ${{ inputs.version }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Regenerate package
        env:
          # Untrusted input: keep in env, see the Security section in README.
          INPUT_PRGNAM: ${{ inputs.prgnam }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          scripts/update-package.sh "$INPUT_PRGNAM" "$INPUT_VERSION"
          source scripts/lib.sh
          render_pr_body "$INPUT_PRGNAM" "$INPUT_VERSION" > /tmp/pr-body.md

      # A PAT, because workflows on PRs opened by github-actions[bot] need
      # manual approval. One branch per package, so a newer version updates
      # the open PR instead of opening another.
      - name: Open update PR
        id: pr
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          token: ${{ secrets.SBO_UPDATE_PR_TOKEN }}
          title: "${{ inputs.category }}/${{ inputs.prgnam }}: Updated for version ${{ inputs.version }}"
          commit-message: "${{ inputs.category }}/${{ inputs.prgnam }}: Updated for version ${{ inputs.version }}"
          body-path: /tmp/pr-body.md
          branch: update/${{ inputs.prgnam }}
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          assignees: perrin4869
          add-paths: |
            sbo/${{ inputs.category }}/${{ inputs.prgnam }}/${{ inputs.prgnam }}.info
            sbo/${{ inputs.category }}/${{ inputs.prgnam }}/${{ inputs.prgnam }}.SlackBuild

      # GitHub doesn't notify you about PRs opened with your own PAT; a
      # comment from github-actions[bot] does (with "Include your own updates" on).
      - name: Notify
        if: contains(fromJSON('["created", "updated"]'), steps.pr.outputs.pull-request-operation)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          PR_OPERATION: ${{ steps.pr.outputs.pull-request-operation }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "@perrin4869 ${PR_OPERATION} by the update pipeline."
